apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: staging
run:
  location: projects/askly-assistant-511810/locations/asia-south1
executionConfigs:
  - usages: [RENDER, DEPLOY]
    serviceAccount: askly-assistant-deploy@askly-assistant-511810.iam.gserviceaccount.com
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: production
requireApproval: true
run:
  location: projects/askly-assistant-511810/locations/asia-south1
executionConfigs:
  - usages: [RENDER, DEPLOY]
    serviceAccount: askly-assistant-deploy@askly-assistant-511810.iam.gserviceaccount.com
---
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: askly-assistant-pipeline
description: Staging validation followed by approved production promotion
serialPipeline:
  stages:
    - targetId: staging
      profiles: [staging]
    - targetId: production
      profiles: [production]
